; ecoTrace Communication Module -- PlatformIO project
; =====================================================
; Board : ESP32-C6-MINI-1 (Rev A, 2026-04-23)
;
; Two build targets:
;   datalogger         -- the main application (sense + charge + sleep + upload)
;   functionality_test -- board bring-up self-test (checks every device)
;
;   pio run -e datalogger -t upload && pio device monitor
;
; The shared board support package lives in lib/EcoTrace and is auto-linked into
; both. Console output is over the native USB Serial/JTAG (GPIO12/13).

[platformio]
default_envs = datalogger

; ---------------------------------------------------------------------------
[common]
; ESP32-C6 + Arduino needs arduino-esp32 v3+, which the OFFICIAL PlatformIO
; espressif32 platform does not ship yet. The pioarduino fork does. Pin the exact
; release so a student six months from now gets an identical toolchain.
platform         = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board            = esp32-c6-devkitc-1
framework        = arduino
monitor_speed    = 115200
monitor_filters  = esp32_exception_decoder

; MINI-1 module = 4 MB flash; custom partition table gives a 3 MB app slot.
board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
board_build.partitions  = partitions.csv

build_flags =
    -DARDUINO_USB_MODE=1            ; C6 has only USB Serial/JTAG (HWCDC)
    -DARDUINO_USB_CDC_ON_BOOT=1    ; Serial -> USB CDC, no UART0 adapter needed
    -DCORE_DEBUG_LEVEL=2           ; warn level; keep IDF chatter down

; ---------------------------------------------------------------------------
[env:datalogger]
extends = common
build_src_filter = -<*> +<datalogger/>

; Same firmware, pushed over WiFi instead of USB. Put the board in OTA mode first
; (press the QON button 3x), then:  pio run -e datalogger_ota -t upload
; If mDNS doesn't resolve on your network, replace upload_port with the IP the
; board prints on serial. If OTA_PASSWORD is set in secrets.h, add:
;   upload_flags = --auth=<password>
[env:datalogger_ota]
extends = env:datalogger
upload_protocol = espota
upload_port     = ecotrace.local

[env:functionality_test]
extends = common
build_src_filter = -<*> +<functionality_test/>
