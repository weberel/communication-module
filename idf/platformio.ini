; ecoTrace datalogger -- ESP-IDF port (the long-term firmware)
; ============================================================
; Lives beside the frozen Arduino reference implementation (../src/datalogger,
; validated on hardware 2026-08-07..10, soak firmware dl-2.14). This port exists
; for what Arduino cannot do:
;   - TLS/MQTT on the ESP over BOTH transports (esp_modem PPP + esp-mqtt +
;     mbedTLS), mTLS-ready for the ATECC608B secure element
;   - LP-core continuous sensor sampling while the HP core sleeps
;   - OTA with bootloader rollback
;   - NVS-based per-device provisioning (one image for the whole fleet)
;
;   cd idf && pio run -t upload && pio device monitor
[platformio]
default_envs = datalogger_idf

[env:datalogger_idf]
; Same pinned pioarduino platform as the Arduino build (it ships espidf too).
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = espidf
board     = esp32-c6-devkitc-1
monitor_speed = 115200

board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
board_build.partitions  = partitions.csv

; Unit B (bypass-reworked SPI flash lands) needs:
; build_flags = -DEXTFLASH_PIN_CS=1 -DEXTFLASH_PIN_CLK=9
